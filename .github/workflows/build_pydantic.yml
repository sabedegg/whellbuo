name: Build Pydantic-Core Termux aarch64 wheel (Python 3.13)

on:
  workflow_dispatch:
    inputs:
      pydantic_core_version:
        description: "pydantic-core version"
        required: true
        default: "2.46.4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enable QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheel inside Termux aarch64 Docker
        run: |
          set -eux

          mkdir -p dist
          chmod 777 dist

          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/out" \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -eux

              export TMPDIR=$HOME/tmp
              mkdir -p "$TMPDIR"
              mkdir -p "$HOME/wheelhouse"

              pkg update -y



              # Force Python 3.13
              pkg install -y \
                clang \
                make \
                binutils \
                pkg-config \
                rust

              python --version

              PYVER=$(python -c "import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")")

              if [ "$PYVER" != "3.13" ]; then
                echo "ERROR: Expected Python 3.13, got $PYVER"
                exit 1
              fi

              python -m ensurepip --upgrade || true

              python -m pip install -U \
                pip \
                setuptools \
                wheel \
                build \
                maturin

              python -m pip wheel \
                --no-binary=:all: \
                --no-cache-dir \
                --wheel-dir "$HOME/wheelhouse" \
                pydantic_core==${{ github.event.inputs.pydantic_core_version }}

              ls -lah "$HOME/wheelhouse"

              cp "$HOME"/wheelhouse/*.whl /out/
              chmod 666 /out/*.whl

              echo "Generated wheels:"
              ls -lah /out
            '

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-termux-cp313-aarch64-wheel
          path: dist/*.whl
