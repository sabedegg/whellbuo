name: Build Cryptography Termux Python 3.13 ARM64

on:
  workflow_dispatch:
    inputs:
      cryptography_version:
        description: "Cryptography version"
        required: true
        default: "50.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enable QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheel inside Termux aarch64
        run: |
          set -eux

          mkdir -p dist
          chmod 777 dist

          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/out" \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -eux

              export TMPDIR=$HOME/tmp
              mkdir -p "$TMPDIR"
              mkdir -p "$HOME/wheelhouse"

              # Update repository
              pkg update -y
              pkg upgrade -y

              # Install TUR
              pkg install -y tur-repo

              # Update after adding TUR
              pkg update -y

              # Install Python 3.13 from TUR
              pkg install -y python3.13

              # Build dependencies
              pkg install -y \
                clang \
                make \
                binutils \
                pkg-config \
                rust \
                openssl \
                libffi

              # Verify Python
              python3.13 --version
              python3.13 -c "
              import sys
              assert sys.version_info[:2] == (3, 13), sys.version
              print(sys.version)
              "

              # Install Python build tools
              python3.13 -m pip install \
                --upgrade pip setuptools wheel

              # Termux OpenSSL paths
              export OPENSSL_DIR=$PREFIX
              export OPENSSL_LIB_DIR=$PREFIX/lib
              export OPENSSL_INCLUDE_DIR=$PREFIX/include
              export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
              export CARGO_HOME=$HOME/.cargo

              # Build wheel from source
              python3.13 -m pip wheel \
                --no-binary=:all: \
                --no-cache-dir \
                --wheel-dir "$HOME/wheelhouse" \
                cryptography==${{ github.event.inputs.cryptography_version }}

              # Copy artifact
              cp "$HOME"/wheelhouse/cryptography*.whl /out/
              chmod 666 /out/*.whl

              ls -lah /out
            '

      - name: Verify wheel
        run: |
          set -eux

          ls -lah dist/
          file dist/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptography-${{ github.event.inputs.cryptography_version }}-cp313-termux-aarch64
          path: dist/*.whl
