
name: Build Cryptography Termux Python 3.13 ARM64

on:
  workflow_dispatch:
    inputs:
      cryptography_version:
        description: "Cryptography version"
        required: true
        default: "50.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enable QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Cryptography wheel in Termux
        shell: bash
        env:
          CRYPTO_VERSION: ${{ github.event.inputs.cryptography_version }}
        run: |
          set -eux

          mkdir -p dist
          chmod 777 dist

          docker run --rm \
            --platform linux/arm64 \
            -e CRYPTO_VERSION="$CRYPTO_VERSION" \
            -v "$PWD/dist:/out" \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -eux

              # Temporary directories
              export TMPDIR="$HOME/tmp"
              mkdir -p "$TMPDIR"
              mkdir -p "$HOME/wheelhouse"

              # Android ARM64 API level
              export ANDROID_API_LEVEL=24

              # Termux prefix
              export PREFIX=/data/data/com.termux/files/usr

              # Update Termux
              pkg update -y
              pkg upgrade -y

              # Enable TUR repository
              pkg install -y tur-repo
              pkg update -y

              # Install Python 3.13
              pkg install -y python3.13

              # Native ARM64 build dependencies
              pkg install -y \
                clang \
                make \
                binutils \
                pkg-config \
                rust \
                openssl \
                libffi

              # Build tools
              python3.13 -m pip install --upgrade \
                pip \
                setuptools \
                wheel

              # Compiler
              export CC=clang
              export CXX=clang++

              # OpenSSL paths
              export OPENSSL_DIR="$PREFIX"
              export OPENSSL_LIB_DIR="$PREFIX/lib"
              export OPENSSL_INCLUDE_DIR="$PREFIX/include"
              export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

              # Rust environment
              export CARGO_HOME="$HOME/.cargo"

              # Verify architecture
              uname -m
              python3.13 -c "import platform; print(platform.machine())"
              rustc --version
              cargo --version
              clang --version

              # Build cryptography wheel
              python3.13 -m pip wheel \
                --no-binary=cryptography \
                --no-cache-dir \
                --wheel-dir "$HOME/wheelhouse" \
                "cryptography==$CRYPTO_VERSION"

              # Copy wheel to output directory
              cp "$HOME"/wheelhouse/cryptography*.whl /out/

              chmod 666 /out/*.whl

              # Verify output
              ls -lh /out/
              file /out/*.whl
            '

      - name: Verify wheel artifact
        shell: bash
        run: |
          set -eux

          ls -lh dist/

          for wheel in dist/*.whl; do
            test -f "$wheel"
            file "$wheel"
          done

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: cryptography-${{ github.event.inputs.cryptography_version }}-python313-termux-arm64-v8a
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
