
name: Build Cryptography Termux Python 3.13 ARM64

on:
  workflow_dispatch:
    inputs:
      cryptography_version:
        description: "Cryptography version"
        required: true
        default: "50.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enable QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Cryptography wheel
        env:
          CRYPTO_VERSION: ${{ github.event.inputs.cryptography_version }}
        run: |
          set -eux

          mkdir -p dist
          chmod 777 dist

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD/dist:/out" \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -eux

              CRYPTO_VERSION="$1"
              export CRYPTO_VERSION

              echo "Building cryptography $CRYPTO_VERSION"

              export TMPDIR="$HOME/tmp"
              mkdir -p "$TMPDIR"
              mkdir -p "$HOME/wheelhouse"

              export ANDROID_API_LEVEL=24
              export PREFIX=/data/data/com.termux/files/usr

              pkg update -y
              pkg upgrade -y

              pkg install -y tur-repo
              pkg update -y

              pkg install -y python3.13

              pkg install -y \
                clang \
                make \
                binutils \
                pkg-config \
                rust \
                openssl \
                libffi

              python3.13 -m pip install --upgrade \
                pip \
                setuptools \
                wheel

              export CC=clang
              export CXX=clang++

              export OPENSSL_DIR="$PREFIX"
              export OPENSSL_LIB_DIR="$PREFIX/lib"
              export OPENSSL_INCLUDE_DIR="$PREFIX/include"
              export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

              export CARGO_HOME="$HOME/.cargo"

              echo "=== Architecture ==="
              uname -m
              python3.13 -c "import platform; print(platform.machine())"

              echo "=== Rust ==="
              rustc --version
              cargo --version

              echo "=== Clang ==="
              clang --version

              echo "=== Build wheel ==="

              python3.13 -m pip wheel \
                --no-binary=cryptography \
                --no-cache-dir \
                --wheel-dir "$HOME/wheelhouse" \
                "cryptography==$CRYPTO_VERSION"

              echo "=== Copy wheel ==="

              cp "$HOME"/wheelhouse/cryptography*.whl /out/
              chmod 666 /out/*.whl

              echo "=== Output ==="
              ls -lah /out/
              file /out/*.whl
            ' _ "$CRYPTO_VERSION"

      - name: Verify wheel
        run: |
          set -eux

          ls -lah dist/
          file dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptography-${{ github.event.inputs.cryptography_version }}-cp313-termux-aarch64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
